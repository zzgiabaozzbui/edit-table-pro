name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 20 only, deliberately: the package ships no Node runtime code, so a
      # matrix would run the identical tsc/biome/vitest/vite job three times.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint + format
        run: npm run check:ci

      - name: Test
        run: npm run test:run

      - name: Build (includes "use client" banner + bundle-size gate)
        run: npm run build

      - name: Verify published types resolve
        run: npx --yes @arethetypeswrong/cli@latest --pack . --exclude-entrypoints style.css

  changelog:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::This PR does not touch CHANGELOG.md. Add an entry under [Unreleased], or label the PR 'no-changelog' if it genuinely needs none."
            exit 1
          fi
